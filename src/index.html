<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
            <nav class="topbar">
                <li class="countries">
                    <select>
                      <option data-country="">All Countries</option>
                    </select>
                </li>
                <li class="categories">
                    <select>
                      <option data-categories="">All Categories</option>
                    </select>
                </li>
            </т>
        </header>
        <main>
            <div class="news"></div>
            <aside class="sources buttons"></aside>
        </main>
        <footer>
            <p class="copyright">Copyright <a href="https://newsapi.org" target="_blank">NewsAPI</a></p>
            <a href="https://rs.school/courses/javascript" class="rsschool-logo" target="_blank">
                <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School" />
                RS School
            </a>
            <a href="https://github.com/shishkinsa997" class="github-logo" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub" />
                GitHub
            </a>
            <p class="year">2026</p>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
